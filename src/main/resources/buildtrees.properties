# BuildTrees default configuration (bundled in the WAR).
#
# Do NOT put real passwords here. Override per server with any of:
#   - JVM system properties, e.g. -Dbuildtrees.db.password=...   (Tomcat bin/setenv.sh)
#   - environment variables, e.g. BUILDTREES_DB_PASSWORD=...
#   - an external file: -Dbuildtrees.config=/etc/buildtrees/buildtrees.properties
#     (default location: ~/.buildtrees/buildtrees.properties of the Tomcat user)

# --- Database ---------------------------------------------------------------
# The app first looks up this JNDI DataSource (defined in META-INF/context.xml).
db.jndi=java:comp/env/jdbc/LinkedDB
# Used by the DriverManager fallback when the JNDI pool is not available.
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/connected?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&zeroDateTimeBehavior=CONVERT_TO_NULL
db.user=realbasis
db.password=dakar005#

# --- Mail -------------------------------------------------------------------
# When mail.smtp.host is set it overrides the server/credentials still written
# in older JSPs. Set mail.enabled=false to only log outgoing mail.
mail.enabled=true
mail.smtp.host=
mail.smtp.port=587
mail.smtp.user=
mail.smtp.password=
mail.smtp.starttls=true
mail.from=buildtrees@realbasis.com
mail.admin=buildtrees@realbasis.com

# --- Admin ------------------------------------------------------------------
# Password for the owner/admin pages (control/doLoginOwner.jsp -> admin.jsp).
# Admin login is disabled while this is empty.
admin.password=

# --- Misc (used by utility.ConfigBean) ----------------------------------------
app.hostpath=http://localhost
app.hostname=localhost
